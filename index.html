<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#1F4A75">
<title>Megasound</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#B8D4E3;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:700px;height:340px;transform-origin:0 0;overflow:hidden;background:#B8D4E3}
#bg{position:absolute;left:0;top:0}
button{font:inherit;cursor:pointer}
.t{position:absolute;color:#fff;font-weight:500}
.lb{top:10px;font-size:11px;font-weight:700;letter-spacing:.5px}
.bar{position:absolute;top:11px;width:170px;height:12px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .3s}
#fP{background:#3DDC4F}#fC{background:#C58BFF}
.fl{animation:fl .35s}@keyframes fl{50%{box-shadow:0 0 0 3px #fff}}
.mini{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:2}
.orb{position:absolute;top:104px;left:0;width:24px;height:24px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:13px;color:#0F1E45}
#eo{background:#fff}
.pl{animation:pl .5s}.ps{animation:ps .5s}@keyframes ps{50%{box-shadow:0 0 0 9px rgba(255,255,255,.75)}}
@keyframes pl{50%{transform:scale(1.5)}}
#fx{position:absolute;top:102px;left:0;width:26px;height:26px;display:none}
#fx::before,#fx::after{content:"";position:absolute;inset:0;background:var(--c,#FFF200)}
#fx::after{transform:rotate(45deg)}
#fx.puff::before,#fx.puff::after{display:none}
#fx.puff{background:#8D9BBB;border-radius:50%;color:#fff;font-weight:700;text-align:center;line-height:26px}
#fx.go{animation:go .5s}
@keyframes go{from{transform:scale(.4)}to{transform:scale(1.4)}}
#pts{position:absolute;top:76px;left:0;width:80px;text-align:center;font-size:15px;font-weight:600;color:#1F4A75;display:none}
#roda{position:absolute;left:0;top:0;pointer-events:none}
.seg{pointer-events:auto;cursor:pointer}
.seg{stroke:rgba(0,0,0,.3);stroke-width:2}
.seg:hover{filter:brightness(1.1)}.seg:active{filter:brightness(.88)}
.seg.ring{filter:brightness(1.3) drop-shadow(0 0 5px #fff)}
.seg.hint{animation:hintS .6s 4}
@keyframes hintS{50%{filter:brightness(1.4) drop-shadow(0 0 9px #fff)}}
.wl{font:700 15px system-ui,"Segoe UI",Arial,sans-serif;pointer-events:none}
#sw{position:absolute;left:512px;top:250px;height:24px;display:flex;align-items:center;gap:8px;cursor:pointer;color:#12324f;font-size:12px;font-weight:700;letter-spacing:.5px}
#sw span{opacity:.4;transition:opacity .15s}
#sw .tr{position:relative;width:46px;height:22px;border-radius:11px;background:#1F2937}
#sw .tr i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
#sw.at .tr i{left:27px}#sw.at .sr{opacity:1}#sw.cu .sl{opacity:1}
.comet{box-shadow:0 0 14px 3px var(--c)}
.comet::before{content:"";position:absolute;top:50%;height:12px;margin-top:-6px;width:84px;pointer-events:none}
.comet.cr::before{right:calc(100% - 4px);background:linear-gradient(to left,var(--c),transparent);clip-path:polygon(100% 0,100% 100%,0 50%)}
.comet.cl::before{left:calc(100% - 4px);background:linear-gradient(to right,var(--c),transparent);clip-path:polygon(0 0,0 100%,100% 50%)}
.ov{position:absolute;left:0;top:0;width:700px;height:340px;background:rgba(184,212,227,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#12324f;z-index:5}
.ov h1{margin:0 0 8px;font-size:28px}.ov p{margin:0 0 16px;font-size:15px;max-width:480px;line-height:1.4}
.big{background:#1F4A75;color:#fff;border:0;border-radius:12px;padding:12px 34px;font-size:19px;font-weight:600}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#titulo{position:fixed;inset:0;z-index:20;background:#7EC8F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;padding:12px;text-align:center}
#titulo .art{width:min(94vw,760px);max-height:44vh;height:auto}
#titulo h1{margin:0;font-size:clamp(34px,9vmin,72px);color:#fff;text-shadow:3px 3px 0 #1F4A75;line-height:1}
#titulo p{margin:0;color:#12324f;font-size:clamp(13px,2.6vmin,18px)}
#tbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:6px}#tbtns .big{font-size:clamp(18px,4vmin,26px);padding:14px 26px;min-width:150px}
#tbtns .alt{background:#fff;color:#1F4A75;border:3px solid #1F4A75}
#msg{position:absolute;left:230px;top:62px;width:240px;text-align:center;background:#7EC8F2;border-radius:14px;padding:8px 0;font-size:15px;color:#12324f;display:none;z-index:3}#msg b{font-size:34px}

#ver{position:absolute;bottom:8px;right:12px;font-size:12px;color:#12324f;opacity:.7}
</style>
</head>
<body>
<div id="stage">
<svg id="bg" width="700" height="340" viewBox="0 0 700 340" aria-hidden="true">
<defs><g id="robo" shape-rendering="crispEdges">
<rect x="4" y="28" width="4" height="12" fill="currentColor"/>
<rect x="12" y="0" width="24" height="4" fill="currentColor"/><rect x="8" y="4" width="32" height="4" fill="currentColor"/><rect x="4" y="8" width="40" height="4" fill="currentColor"/>
<rect x="4" y="12" width="8" height="12" fill="currentColor"/><rect x="36" y="12" width="8" height="12" fill="currentColor"/>
<rect x="12" y="12" width="24" height="12" fill="#F5D0A9"/><rect x="20" y="12" width="12" height="8" fill="#fff"/><rect x="28" y="12" width="4" height="8" fill="#0F1E45"/>
<rect x="8" y="24" width="32" height="16" fill="currentColor"/><rect x="16" y="28" width="16" height="4" fill="#fff" opacity=".4"/><rect x="8" y="36" width="32" height="4" fill="#1F2937"/>
<rect x="40" y="24" width="12" height="12" fill="currentColor"/><rect x="52" y="24" width="4" height="12" fill="#333"/><rect x="44" y="26" width="6" height="2" fill="#fff" opacity=".45"/>
<rect x="12" y="40" width="8" height="16" fill="currentColor"/><rect x="28" y="40" width="8" height="16" fill="currentColor"/>
<rect x="8" y="56" width="12" height="8" fill="#333"/><rect x="24" y="56" width="12" height="8" fill="#333"/></g></defs>
<rect width="700" height="340" fill="#B8D4E3"/><rect y="34" width="700" height="152" fill="#7EC8F2"/>
<ellipse cx="200" cy="62" rx="34" ry="11" fill="#fff" opacity=".85"/><ellipse cx="520" cy="64" rx="30" ry="10" fill="#fff" opacity=".85"/>
<rect y="150" width="700" height="36" fill="#6B7A99"/><rect y="150" width="700" height="6" fill="#8D9BBB"/>
<g stroke="#4F5B78" stroke-width="2"><line x1="0" y1="168" x2="700" y2="168"/><line x1="70" y1="156" x2="70" y2="168"/><line x1="210" y1="156" x2="210" y2="168"/><line x1="350" y1="156" x2="350" y2="168"/><line x1="490" y1="156" x2="490" y2="168"/><line x1="630" y1="156" x2="630" y2="168"/></g>
<rect width="700" height="34" fill="#1F4A75"/>
<g id="plg"><use href="#robo" transform="translate(66,86)" style="color:#2FA7E0"/></g>
<g id="pcg"><use href="#robo" transform="translate(634,86) scale(-1,1)" style="color:#8E5BD9"/></g>
</svg>
<div class="t lb" style="left:14px">VOCÊ</div><div class="bar" id="bP" style="left:56px"><i id="fP"></i></div>
<div class="t lb" style="left:484px">PC</div><div class="bar" id="bC" style="left:512px"><i id="fC"></i></div>
<div class="orb" id="eo">&#9834;</div><div class="orb" id="co"></div><div id="fx"></div><div id="pts"></div><div id="msg"></div>

<div id="sw" class="at"><span class="sl">CURAR</span><div class="tr"><i></i></div><span class="sr">ATACAR</span></div>
<button class="g" id="mnu" style="left:322px;top:5px;width:56px;height:24px;border-radius:12px;font-size:12px">Menu</button>

<div class="ov" id="fim" style="display:none"><h1 id="fimT">Fim de jogo</h1><p id="res"></p><div style="display:flex;gap:12px"><button class="big" id="again">Jogar de novo</button><button class="big" id="fimMenu" style="background:#fff;color:#1F4A75;border:3px solid #1F4A75">Menu</button></div></div>
</div>
<div id="titulo">
<svg class="art" viewBox="0 0 700 200" aria-hidden="true">
<ellipse cx="110" cy="34" rx="36" ry="12" fill="#fff" opacity=".85"/><ellipse cx="600" cy="30" rx="30" ry="10" fill="#fff" opacity=".85"/>
<rect y="160" width="700" height="40" fill="#6B7A99"/><rect y="160" width="700" height="6" fill="#8D9BBB"/>
<use href="#robo" transform="translate(60,19) scale(2.2)" style="color:#2FA7E0"/><use href="#robo" transform="translate(640,19) scale(-2.2,2.2)" style="color:#8E5BD9"/>
<line x1="190" y1="85" x2="340" y2="85" stroke="#25C5E8" stroke-width="4" stroke-dasharray="4 9" stroke-linecap="round"/><line x1="510" y1="85" x2="360" y2="85" stroke="#fff" stroke-width="4" stroke-dasharray="4 9" stroke-linecap="round"/>
<circle cx="250" cy="85" r="15" fill="#25C5E8"/><circle cx="450" cy="85" r="15" fill="#fff"/>
<g transform="translate(350,85)"><rect x="-16" y="-16" width="32" height="32" fill="#FFF200"/><rect x="-16" y="-16" width="32" height="32" fill="#FFF200" transform="rotate(45)"/><circle r="8" fill="#fff"/></g>
<g font-size="26"><text x="225" y="40" fill="#E8000B">&#9834;</text><text x="267" y="56" fill="#F57C00">&#9834;</text><text x="309" y="40" fill="#FFF200">&#9834;</text><text x="351" y="56" fill="#12C800">&#9834;</text><text x="393" y="40" fill="#25C5E8">&#9834;</text><text x="435" y="56" fill="#2A14E0">&#9834;</text><text x="477" y="40" fill="#D800D8">&#9834;</text></g>
</svg>
<h1>Megasound</h1><p>Treine o ouvido pelos graus da escala</p>
<div id="tbtns"><button class="big" id="bb">Batalhar</button></div>
<div id="ver">Versão 3.1</div>
</div>

<script>
(function(){
var SEMI=[0,2,4,5,7,9,11,12],COL=["#E8000B","#F57C00","#FFF200","#12C800","#25C5E8","#2A14E0","#D800D8","#E8000B"];
var NOM=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var $=function(i){return document.getElementById(i);};
var stage=$("stage"),ctx=null,tom=0,tok=0,phase="menu",target=0,last=-1,chosen=0,answered=false;
var CFG={hp:100,pc:100,atk:10,wrong:20,idle:10,heal:10,ret:520,minis:6};
var ex=566,cx=134,elapsed=0,php=100,pchp=100,mode="atk",act="atk",targetMidi=60,prev=0,minis=[];
var msgTok=-1,START=566,HITX=124,PCX=586,DUR=10,SPEED=(START-HITX)/DUR;
var TESS=[41,43,45,47,48,50,52,53,55,57,59,60,62,64],DEGPC={0:0,2:1,4:2,5:3,7:4,9:5,11:6};

function fit(){var w=innerWidth,h=innerHeight,s=Math.min(w/700,h/340);stage.style.transform="scale("+s+")";stage.style.left=((w-700*s)/2)+"px";stage.style.top=((h-340*s)/2)+"px";}
addEventListener("resize",fit);fit();

function tm(){return (tom<=6?60:48)+tom;}
function tone(m,d,h){if(!ctx)return;var t=ctx.currentTime+.02,f=440*Math.pow(2,(m-69)/12),g=ctx.createGain();
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.012);if(h)g.gain.setValueAtTime(.3,t+d-.35);g.gain.exponentialRampToValueAtTime(.0001,t+d);g.connect(ctx.destination);
var a=ctx.createOscillator();a.type="triangle";a.frequency.value=f;a.connect(g);var g2=ctx.createGain();g2.gain.value=.25;g2.connect(g);
var b=ctx.createOscillator();b.type="sine";b.frequency.value=f*2;b.connect(g2);a.start(t);b.start(t);a.stop(t+d+.05);b.stop(t+d+.05);}
function playT(){tone(targetMidi,1,true);}
function beep(f,at,d,ty,v,f2){if(!ctx)return;var t=ctx.currentTime+at,o=ctx.createOscillator(),g=ctx.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02);}
function sfxOk(){beep(784,0,.12,"square",.12);beep(1175,.1,.22,"square",.12);}
function sfxErr(){beep(160,0,.28,"sawtooth",.2,90);beep(130,.16,.32,"sawtooth",.2,70);}
function later(fn,ms){var t=tok;setTimeout(function(){if(t===tok)fn();},ms);}
function btn(i){return document.querySelector('.seg[data-i="'+i+'"]');}
function anim(el,c,ms){el.classList.remove(c);void el.getBoundingClientRect();el.classList.add(c);setTimeout(function(){el.classList.remove(c);},ms);}
function hud(){$("fP").style.width=Math.max(0,php/CFG.hp*100)+"%";$("fC").style.width=Math.max(0,pchp/CFG.pc*100)+"%";}
function showMode(){$("sw").className=mode==="atk"?"at":"cu";}
function toggle(){mode=mode==="atk"?"cur":"atk";showMode();beep(mode==="atk"?330:520,0,.08,"square",.08);}
function place(o,x){o.style.transform="translateX("+(x-12)+"px)";}
function popup(x,t,col){var p=$("pts");p.textContent=t;p.style.color=col;p.style.left=(x-40)+"px";p.style.display="block";setTimeout(function(){p.style.display="none";},900);}
function pickNote(){var m,d;do{m=TESS[Math.floor(Math.random()*TESS.length)];d=DEGPC[m%12];}while(d===last);last=d;target=d;targetMidi=m;}

function fire(){pickNote();
ex=START;elapsed=0;answered=false;phase="flying";
var e=$("eo");e.className="orb";e.style.removeProperty("--c");e.style.background="";e.style.color="";e.style.display="flex";place(e,ex);playT();anim(e,"ps",500);}
function answer(i){if(phase!=="flying"||answered)return;answered=true;chosen=i;act=mode;cx=134;phase="counter";
var c=$("co");c.style.display="flex";c.style.background=COL[i];place(c,cx);btn(i).classList.add("ring");}
function burst(x,col,puff){var f=$("fx");f.style.display="block";f.className=puff?"puff":"";f.style.setProperty("--c",col);f.textContent=puff?"\u2715":"";
f.style.left=(x-13)+"px";void f.offsetWidth;f.classList.add("go");setTimeout(function(){f.style.display="none";},550);}
function clearMinis(){while(minis.length){var m=minis.pop();if(m.parentNode)m.parentNode.removeChild(m);}}
function heal(who,amt){if(who==="p"){php=Math.min(CFG.hp,php+amt);anim($("bP"),"fl",350);}else{pchp=Math.min(CFG.pc,pchp+amt);anim($("bC"),"fl",350);}hud();}
function splash(x,col,who){var tx=who==="p"?96:606,n=CFG.minis,end=300+(n-1)*45+520;
for(var k=0;k<n;k++)(function(k){var m=document.createElement("div");m.className="mini";m.style.background=col;m.style.transform="translate("+(x-4)+"px,112px)";stage.appendChild(m);minis.push(m);void m.offsetWidth;
var rx=(Math.random()-.5)*70,ry=(Math.random()-.5)*60;
setTimeout(function(){m.style.transition="transform .25s ease-out";m.style.transform="translate("+(x-4+rx)+"px,"+(112+ry)+"px)";},20);
setTimeout(function(){m.style.transition="transform .5s ease-in";m.style.transform="translate("+(tx-4)+"px,112px)";},300+k*45);
setTimeout(function(){if(m.parentNode)m.parentNode.removeChild(m);},300+k*45+540);
later(function(){heal(who,CFG.heal/n);},300+k*45+500);})(k);
later(function(){popup(tx,"+"+CFG.heal,"#0B7A1E");},end);}
function comet(dir){var e=$("eo");e.style.setProperty("--c",COL[target]);e.style.background=COL[target];e.style.color=TXC[target];e.className="orb comet "+(dir>0?"cr":"cl");anim(e,"ps",500);}
function collide(){$("co").style.display="none";var b=btn(chosen);b.classList.remove("ring");var eo=$("eo");
if(chosen===target){anim(b,"ring",600);sfxOk();
if(act==="atk"){comet(1);phase="toPC";}
else{burst(ex,COL[target],false);eo.style.display="none";splash(ex,COL[target],"p");phase="between";later(fire,1900);}}
else{hint(target);sfxErr();
if(act==="atk"){comet(-1);phase="run";}
else{burst(ex,"#8D9BBB",true);eo.style.display="none";splash(ex,COL[target],"c");phase="between";later(fire,1900);}}}
var TXC=["#fff","#2b1500","#332f00","#052b00","#002f3a","#fff","#fff"];
function hint(i){anim(btn(i),"hint",2500);}
function hit(){$("eo").style.display="none";var d=answered?CFG.wrong:CFG.idle;if(!answered){hint(target);sfxErr();}
php=Math.max(0,php-d);hud();popup(96,"-"+d,"#C1121F");anim($("plg"),"shake",400);anim($("bP"),"fl",400);
if(php<=0){phase="over";later(function(){over(false);},1200);}else{phase="between";later(fire,1800);}}
function hitPC(){$("eo").style.display="none";pchp=Math.max(0,pchp-CFG.atk);hud();burst(PCX,COL[target],false);popup(606,"-"+CFG.atk,"#C1121F");anim($("pcg"),"shake",400);anim($("bC"),"fl",400);
if(pchp<=0){phase="over";later(function(){over(true);},1200);}else{phase="between";later(fire,1300);}}
function over(win){$("fimT").textContent=win?"Vitória!":"Derrota";$("res").textContent=win?"O PC foi derrotado.":"Seu HP chegou a zero.";$("fim").style.display="flex";}
function begin(){tok++;php=CFG.hp;pchp=CFG.pc;mode="atk";showMode();last=-1;hud();clearMinis();$("eo").style.display="none";$("co").style.display="none";
$("fim").style.display="none";escala(fire);}

function tick(ts){var dt=Math.min(.05,(ts-prev)/1000);prev=ts;if(msgTok!==tok)$("msg").style.display="none";
if(phase==="flying"){elapsed+=dt;ex=START-SPEED*elapsed;place($("eo"),ex);
if(ex<=HITX)hit();}
else if(phase==="counter"){elapsed+=dt;ex-=SPEED*dt;cx+=650*dt;place($("eo"),ex);place($("co"),cx);if(cx>=ex)collide();}
else if(phase==="run"){ex-=CFG.ret*dt;place($("eo"),ex);if(ex<=HITX)hit();}
else if(phase==="toPC"){ex+=CFG.ret*dt;place($("eo"),ex);if(ex>=PCX)hitPC();}
requestAnimationFrame(tick);}
requestAnimationFrame(function(t){prev=t;tick(t);});

var NAMES=["DO","RE","MI","FA","SOL","LA","SI"];
var WCX=350,WCY=262,WR=74,SVGNS="http://www.w3.org/2000/svg";
function svgEl(t,a,p){var e=document.createElementNS(SVGNS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function pt(r,deg){var a=deg*Math.PI/180;return [WCX+r*Math.cos(a),WCY+r*Math.sin(a)];}
function sector(a0,a1){var p0=pt(WR,a0),p1=pt(WR,a1);
return "M"+WCX+" "+WCY+" L"+p0[0].toFixed(2)+" "+p0[1].toFixed(2)+" A"+WR+" "+WR+" 0 0 1 "+p1[0].toFixed(2)+" "+p1[1].toFixed(2)+" Z";}
var wheel=svgEl("svg",{id:"roda",width:700,height:340,viewBox:"0 0 700 340"});
for(var i=0;i<7;i++)(function(i){var c=-90+i*360/7,seg=svgEl("path",{"class":"seg","data-i":i,d:sector(c-180/7,c+180/7),fill:COL[i]},wheel);
var tp=pt(46,c),t=svgEl("text",{x:tp[0],y:tp[1]+5,"text-anchor":"middle","class":"wl",fill:TXC[i]},wheel);t.textContent=NAMES[i];
seg.addEventListener("pointerdown",function(e){e.preventDefault();answer(i);});})(i);
stage.appendChild(wheel);
$("sw").addEventListener("pointerdown",function(e){e.preventDefault();toggle();});
$("again").addEventListener("click",begin);
function escala(done){msgTok=tok;phase="between";var n=NOM[tom],m=$("msg");m.style.display="block";
for(var k=0;k<8;k++)(function(k){later(function(){tone(tm()+SEMI[k],.5,true);anim(btn(k%7),"ring",420);m.innerHTML="<small>Escala de "+n+" maior</small><br><b>"+NAMES[k%7]+"</b>";},k*520);})(k);
later(function(){m.style.display="none";done();},8*520+500);}
$("bb").addEventListener("click",function(){
var AC=window.AudioContext||window.webkitAudioContext;if(!ctx)ctx=new AC();if(ctx.state==="suspended")ctx.resume();
$("titulo").style.display="none";tom=0;begin();});
$("fimMenu").addEventListener("click",function(){$("mnu").click();});
$("mnu").addEventListener("click",function(){$("fim").style.display="none";tok++;phase="menu";$("eo").style.display="none";$("co").style.display="none";clearMinis();
$("titulo").style.display="flex";});
hud();showMode();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
