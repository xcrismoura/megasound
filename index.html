<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MegaSound v1.3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <header class="hud-top">
      <div class="hud-title">MEGASOUND <span class="badge">v1.3</span></div>
    </header>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="960" height="480"></canvas>

      <!-- Tela Inicial Minimalista -->
      <div id="startOverlay" class="overlay active">
        <div class="start-minimal">
          <h1 class="logo">MEGASOUND</h1>
          <button id="startBtn" class="btn-primary">INICIAR BATALHA</button>
        </div>
      </div>

      <!-- Tela de Fim de Jogo -->
      <div id="endOverlay" class="overlay">
        <div class="panel">
          <h2 id="endTitle" class="logo">VITÓRIA!</h2>
          <p id="endStats" class="subtitle"></p>
          <button id="restartBtn" class="btn-primary">JOGAR NOVAMENTE</button>
        </div>
      </div>
    </div>

    <!-- Teclado / Controles de Disparo -->
    <section class="note-deck" id="noteDeck">
      <button class="note-btn" data-index="0"><span class="key">A</span><span class="name">Dó</span></button>
      <button class="note-btn" data-index="1"><span class="key">S</span><span class="name">Ré</span></button>
      <button class="note-btn" data-index="2"><span class="key">D</span><span class="name">Mi</span></button>
      <button class="note-btn" data-index="3"><span class="key">F</span><span class="name">Fá</span></button>
      <button class="note-btn" data-index="4"><span class="key">J</span><span class="name">Sol</span></button>
      <button class="note-btn" data-index="5"><span class="key">K</span><span class="name">Lá</span></button>
      <button class="note-btn" data-index="6"><span class="key">L</span><span class="name">Si</span></button>
      <button class="note-btn" data-index="7"><span class="key">Ç</span><span class="name">Dó8</span></button>
    </section>

    <footer class="bottom-bar">
      <button id="tonicBtn" class="btn-secondary">🔊 Referência Dó [Espaço]</button>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
